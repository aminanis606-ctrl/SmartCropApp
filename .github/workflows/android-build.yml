name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download and Setup Gradle Manually
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" || {
          echo "=========================================="
          echo "MENCARI PENYEBAB UTAMA ERROR (FAILURE):"
          echo "=========================================="
          find ~/.gradle -name "*.log" -exec grep -C 3 "FAILURE:" {} + 2>/dev/null || true
          exit 1
        }

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
